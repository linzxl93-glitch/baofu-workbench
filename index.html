<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7C5CFC" />
  <title>暴富专属工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="暴富工作台" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blob blob-a"></div>
  <div class="bg-blob blob-b"></div>
  <div class="bg-blob blob-c"></div>

  <!-- 登录门 -->
  <div class="login-mask" id="loginMask">
    <div class="login-card">
      <div class="login-logo">💰</div>
      <h2>暴富专属工作台</h2>
      <p class="login-sub">请输入访问密码</p>
      <input type="password" id="loginPwd" placeholder="密码" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()" />
      <button class="btn" onclick="doLogin()" style="width:100%;margin-top:10px">进入</button>
      <p class="login-hint">登录后 7 天免登录 · 数据仅在本机</p>
    </div>
  </div>

  <div class="app">
    <!-- 左侧纵向导航栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-avatar">💰</div>
        <div class="brand-name">暴富<br/>工作台</div>
      </div>
      <div class="nav-list">
        <button class="nav-btn active" data-view="plan" onclick="setView('plan')">
          <span class="nav-ico">📋</span><span class="nav-label">每日计划</span>
        </button>
        <button class="nav-btn" data-view="expense" onclick="setView('expense')">
          <span class="nav-ico">💰</span><span class="nav-label">每日花费</span>
        </button>
        <button class="nav-btn" data-view="idea" onclick="setView('idea')">
          <span class="nav-ico">💡</span><span class="nav-label">灵感记录</span>
        </button>
        <button class="nav-btn" data-view="exercise" onclick="setView('exercise')">
          <span class="nav-ico">🏃</span><span class="nav-label">锻炼身体</span>
        </button>
        <button class="nav-btn" data-view="reading" onclick="setView('reading')">
          <span class="nav-ico">📖</span><span class="nav-label">每日阅读</span>
        </button>
        <button class="nav-btn" data-view="sleep" onclick="setView('sleep')">
          <span class="nav-ico">⏰</span><span class="nav-label">睡眠闹钟</span>
        </button>
        <button class="nav-btn" data-view="task" onclick="setView('task')">
          <span class="nav-ico">🎯</span><span class="nav-label">任务看板</span>
        </button>
      </div>
      <div class="logout-wrap"><button class="logout-btn" onclick="logout()">↪ 退出登录</button></div>
    </nav>

    <!-- 右侧内容区 -->
    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">每日计划</h1>
        <span class="topbar-date" id="topDate"></span>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- 底部全局操作条 -->
  <footer class="footerbar">
    <button class="reset-btn" onclick="resetToday()">🧹 重置今日（仅清计划）</button>
  </footer>

  <!-- 目标模态框 -->
  <div class="task-modal" id="goalModal">
    <div class="task-modal-overlay" onclick="closeGoalModal()"></div>
    <div class="task-modal-content">
      <div class="task-modal-header">
        <h3 id="gmTitle">新增目标</h3>
        <button class="task-modal-close" onclick="closeGoalModal()">✕</button>
      </div>
      <div class="task-modal-body">
        <div class="task-form-group">
          <label>目标名称 *</label>
          <input id="gmName" placeholder="比如：读30本书、跑100公里" />
        </div>
        <div class="task-form-row">
          <div class="task-form-group">
            <label>目标量 *</label>
            <input id="gmTarget" type="number" min="1" placeholder="30" />
          </div>
          <div class="task-form-group">
            <label>单位</label>
            <input id="gmUnit" placeholder="本/公里/小时/次" value="本" />
          </div>
        </div>
        <div class="task-form-group">
          <label>颜色</label>
          <div class="goal-color-picker" id="gmColorPicker">
            <span class="goal-color-opt selected" data-c="#7C3AED" style="background:#7C3AED" onclick="pickGoalColor(this)"></span>
            <span class="goal-color-opt" data-c="#0D9488" style="background:#0D9488" onclick="pickGoalColor(this)"></span>
            <span class="goal-color-opt" data-c="#EA580C" style="background:#EA580C" onclick="pickGoalColor(this)"></span>
            <span class="goal-color-opt" data-c="#2563EB" style="background:#2563EB" onclick="pickGoalColor(this)"></span>
            <span class="goal-color-opt" data-c="#DB2777" style="background:#DB2777" onclick="pickGoalColor(this)"></span>
            <span class="goal-color-opt" data-c="#059669" style="background:#059669" onclick="pickGoalColor(this)"></span>
          </div>
          <input type="hidden" id="gmColor" value="#7C3AED" />
        </div>
      </div>
      <div class="task-modal-footer">
        <button id="gmDelete" class="btn-danger" onclick="deleteGoal(editingGoalId)" style="display:none">删除</button>
        <div class="task-modal-footer-right">
          <button class="btn-ghost" onclick="closeGoalModal()">取消</button>
          <button class="btn-primary-modal" onclick="saveGoal()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 任务模态框 -->
  <div class="task-modal" id="taskModal">
    <div class="task-modal-overlay" onclick="closeTaskModal()"></div>
    <div class="task-modal-content">
      <div class="task-modal-header">
        <h3 id="tmTitle">新增任务</h3>
        <button class="task-modal-close" onclick="closeTaskModal()">✕</button>
      </div>
      <div class="task-modal-body">
        <div class="task-form-group">
          <label>任务名称 *</label>
          <input id="tmName" placeholder="做什么？" />
        </div>
        <div class="task-form-row">
          <div class="task-form-group">
            <label>类型 <button class="type-manage-btn" onclick="toggleTypeManager()" type="button">⚙ 管理</button></label>
            <select id="tmType"></select>
            <div class="type-manager" id="typeManager">
              <div class="type-manager-list" id="typeManagerList"></div>
              <div class="type-manager-add">
                <input id="newTypeName" placeholder="新类型名称" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewType()}" />
                <button class="type-add-btn" onclick="addNewType()" type="button">＋</button>
              </div>
            </div>
          </div>
          <div class="task-form-group">
            <label>状态</label>
            <select id="tmStatus">
              <option>待开始</option><option>进行中</option><option>已完成</option>
            </select>
          </div>
        </div>
        <div class="task-form-row">
          <div class="task-form-group">
            <label>优先级</label>
            <select id="tmPriority">
              <option value="">无</option><option value="P0">P0 紧急</option><option value="P1">P1 重要</option><option value="P2">P2 普通</option>
            </select>
          </div>
          <div class="task-form-group">
            <label>截止日期</label>
            <input id="tmDeadline" type="date" />
          </div>
        </div>
        <div class="task-form-group">
          <label>进度（0-100）</label>
          <input id="tmProgress" type="number" min="0" max="100" value="0" />
        </div>
        <div class="task-form-group">
          <label>卡点/阻塞</label>
          <input id="tmBlocker" placeholder="有什么卡住了？（可选）" />
        </div>
        <div class="task-form-group">
          <label class="task-checkbox-label">
            <input id="tmFocus" type="checkbox" /> ⚡ 设为今日焦点
          </label>
        </div>
        <div class="task-form-group">
          <label>备注</label>
          <textarea id="tmNote" rows="2" placeholder="补充说明（可选）"></textarea>
        </div>
      </div>
      <div class="task-modal-footer">
        <button id="tmDelete" class="btn-danger" onclick="deleteTask()" style="display:none">删除</button>
        <div class="task-modal-footer-right">
          <button class="btn-ghost" onclick="closeTaskModal()">取消</button>
          <button class="btn-primary-modal" onclick="saveTask()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js" defer></script>
</body>
</html>
